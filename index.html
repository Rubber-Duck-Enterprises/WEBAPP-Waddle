<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="App de finanzas personales: Waddle" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <title>Waddle</title>
    <style>
      /* Deshabilita transiciones de color durante la carga para evitar flash/animación */
      html.theme-loading,
      html.theme-loading * {
        transition: none !important;
      }
    </style>
    <script>
      // Aplica el tema guardado lo antes posible y gestiona el inicio de la animación del splash.
      (function() {
        var html = document.documentElement;
        html.classList.add('theme-loading');
        window.__waddleSplashStarted = false;

        function startSplash(theme) {
          if (window.__waddleSplashStarted) return;
          window.__waddleSplashStarted = true;

          var validTheme = (theme === 'dark') ? 'dark' : 'light';

          if (validTheme === 'dark') {
            html.setAttribute('data-theme', 'dark');
          } else {
            html.setAttribute('data-theme', 'light');
          }

          try {
            localStorage.setItem('waddle-theme', validTheme);
          } catch(e) {}

          var triggerSplash = function() {
            var splash = document.getElementById('waddle-splash');
            if (splash) {
              splash.classList.add('splash-start');
            }
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                html.classList.remove('theme-loading');
              });
            });
          };

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', triggerSplash);
          } else {
            triggerSplash();
          }
        }

        // 1. Intento síncrono desde localStorage mirror
        try {
          var cached = localStorage.getItem('waddle-theme');
          if (cached === 'light' || cached === 'dark') {
            startSplash(cached);
            return;
          }
        } catch (e) {}

        // 2. Fallback: leer de IndexedDB (localforage) directamente
        try {
          var req = indexedDB.open('localforage');
          req.onsuccess = function(e) {
            try {
              var db = e.target.result;
              var tx = db.transaction('keyvaluepairs', 'readonly');
              var store = tx.objectStore('keyvaluepairs');

              var cursorReq = store.openCursor();
              cursorReq.onsuccess = function(ev) {
                var cursor = ev.target.result;
                if (cursor) {
                  if (cursor.key && cursor.key.toString().indexOf('waddle-settings') === 0) {
                    try {
                      var data = JSON.parse(cursor.value);
                      var state = data.state || data;
                      if (state.theme === 'light' || state.theme === 'dark') {
                        startSplash(state.theme);
                        return;
                      }
                    } catch(x) {}
                  }
                  cursor.continue();
                } else {
                  startSplash('light');
                }
              };
              cursorReq.onerror = function() { startSplash('light'); };
            } catch(x) { startSplash('light'); }
          };
          req.onerror = function() { startSplash('light'); };
        } catch(e) {
          startSplash('light');
        }

        // Safety: si después de 150ms no se resolvió IndexedDB, iniciar con tema por defecto ('light')
        setTimeout(function() {
          if (!window.__waddleSplashStarted) {
            startSplash('light');
          }
        }, 150);
      })();
    </script>
  </head>
  <body>
    <!-- Splash loader — se remueve solo después de la animación -->
    <div id="waddle-splash">
      <div class="splash-bg"></div>
      <!-- Nubes (tema claro) -->
      <div class="splash-clouds">
        <div class="splash-cloud cloud-1">☁️</div>
        <div class="splash-cloud cloud-2">☁️</div>
        <div class="splash-cloud cloud-3">⛅</div>
        <div class="splash-cloud cloud-4">☁️</div>
      </div>
      <!-- Estrellas (tema oscuro) -->
      <div class="splash-stars">
        <div class="splash-star star-1">✦</div>
        <div class="splash-star star-2">✧</div>
        <div class="splash-star star-3">✦</div>
        <div class="splash-star star-4">✧</div>
        <div class="splash-star star-5">✦</div>
        <div class="splash-star star-6">⭐</div>
        <div class="splash-star star-7">✧</div>
        <div class="splash-star star-8">✦</div>
      </div>
      <div class="splash-emoji splash-sun">☀️</div>
      <div class="splash-emoji splash-moon">🌙</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      #waddle-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        overflow: hidden;
      }

      /* 
        El fondo es 3x la altura de la pantalla para tener zonas sólidas
        arriba (claro) y abajo (oscuro) con una franja de transición en medio.
        Se desplaza verticalmente para revelar solo un color al final.
      */
      #waddle-splash .splash-bg {
        position: absolute;
        left: 0;
        right: 0;
        height: 300%;
        top: -100%; /* empieza centrado */
        background: linear-gradient(
          to bottom,
          #121212 0%,
          #121212 40%,
          #ffffff 60%,
          #ffffff 100%
        );
      }

      /* La animación solo arranca cuando el tema ha sido resuelto (.splash-start) */
      #waddle-splash.splash-start .splash-bg {
        animation: splash-slide-light 1.6s ease-in-out forwards;
      }

      [data-theme="dark"] #waddle-splash.splash-start .splash-bg {
        animation: splash-slide-dark 1.6s ease-in-out forwards;
      }

      /* Emojis */
      #waddle-splash .splash-emoji {
        position: absolute;
        font-size: 3rem;
        z-index: 1;
        transition: none;
      }

      /* Sol — arriba derecha inicialmente */
      #waddle-splash .splash-sun {
        top: 15%;
        right: 15%;
      }

      #waddle-splash.splash-start .splash-sun {
        animation: splash-sun-light 1.6s ease-in-out forwards;
      }

      /* Luna — abajo izquierda inicialmente */
      #waddle-splash .splash-moon {
        top: 75%;
        left: 15%;
      }

      #waddle-splash.splash-start .splash-moon {
        animation: splash-moon-light 1.6s ease-in-out forwards;
      }

      /* === TEMA CLARO === */
      @keyframes splash-slide-light {
        0% { top: -100%; }
        100% { top: -200%; }
      }

      @keyframes splash-sun-light {
        0% { top: 15%; right: 15%; transform: translate(0, 0) scale(1); }
        100% { top: 10%; right: 50%; transform: translate(50%, 0) scale(1.4); }
      }

      @keyframes splash-moon-light {
        0% { opacity: 1; top: 75%; left: 15%; transform: translate(0, 0) scale(1); }
        50% { opacity: 0.2; }
        100% { opacity: 0; top: 75%; left: 15%; transform: translate(0, 0) scale(0.8); }
      }

      /* === TEMA OSCURO === */
      [data-theme="dark"] #waddle-splash.splash-start .splash-sun {
        animation: splash-sun-dark 1.6s ease-in-out forwards;
      }

      [data-theme="dark"] #waddle-splash.splash-start .splash-moon {
        animation: splash-moon-dark 1.6s ease-in-out forwards;
      }

      @keyframes splash-slide-dark {
        0% { top: -100%; }
        100% { top: 0%; }
      }

      @keyframes splash-sun-dark {
        0% { opacity: 1; top: 15%; right: 15%; transform: translate(0, 0) scale(1); }
        50% { opacity: 0.2; }
        100% { opacity: 0; top: 15%; right: 15%; transform: translate(0, 0) scale(0.8); }
      }

      @keyframes splash-moon-dark {
        0% { top: 75%; left: 15%; transform: translate(0, 0) scale(1); }
        100% { top: 10%; left: 50%; transform: translate(-50%, 0) scale(1.4); }
      }

      /* Fade out del splash — empieza DESPUÉS de que la animación del gradiente termine */
      #waddle-splash.splash-start {
        animation: splash-fadeout 0.5s ease-out 1.8s forwards;
      }

      @keyframes splash-fadeout {
        0% { opacity: 1; }
        100% { opacity: 0; pointer-events: none; }
      }

      /* === NUBES (tema claro) === */
      #waddle-splash .splash-clouds {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0;
      }

      #waddle-splash.splash-start .splash-clouds {
        animation: clouds-fadein 1s ease-out 0.6s forwards;
      }

      [data-theme="dark"] #waddle-splash .splash-clouds {
        display: none;
      }

      #waddle-splash .splash-cloud {
        position: absolute;
        font-size: 2.5rem;
        opacity: 0.85;
        animation: cloud-float 3s ease-in-out infinite alternate;
      }

      .cloud-1 { top: 20%; left: 10%; font-size: 2rem; animation-delay: 0s; }
      .cloud-2 { top: 30%; right: 8%; font-size: 3rem; animation-delay: 0.5s; }
      .cloud-3 { top: 45%; left: 25%; font-size: 2.2rem; animation-delay: 1s; }
      .cloud-4 { top: 15%; right: 30%; font-size: 1.8rem; animation-delay: 0.3s; }

      @keyframes clouds-fadein {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes cloud-float {
        0% { transform: translateX(0) translateY(0); }
        100% { transform: translateX(8px) translateY(-4px); }
      }

      /* === ESTRELLAS (tema oscuro) === */
      #waddle-splash .splash-stars {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
      }

      [data-theme="dark"] #waddle-splash .splash-stars {
        display: block;
        opacity: 0;
      }

      [data-theme="dark"] #waddle-splash.splash-start .splash-stars {
        animation: stars-fadein 1s ease-out 0.6s forwards;
      }

      #waddle-splash .splash-star {
        position: absolute;
        color: #ffffff;
        opacity: 0;
        animation: star-twinkle 1.5s ease-in-out infinite alternate;
      }

      .star-1 { top: 12%; left: 20%; font-size: 1rem; animation-delay: 0.2s; }
      .star-2 { top: 25%; right: 25%; font-size: 1.4rem; animation-delay: 0.6s; }
      .star-3 { top: 18%; left: 55%; font-size: 0.8rem; animation-delay: 0.9s; }
      .star-4 { top: 35%; left: 12%; font-size: 1.2rem; animation-delay: 0.4s; }
      .star-5 { top: 40%; right: 15%; font-size: 0.9rem; animation-delay: 1.1s; }
      .star-6 { top: 8%; left: 40%; font-size: 1.3rem; animation-delay: 0.7s; }
      .star-7 { top: 50%; left: 65%; font-size: 1.1rem; animation-delay: 0.3s; }
      .star-8 { top: 28%; right: 45%; font-size: 0.7rem; animation-delay: 1.3s; }

      @keyframes stars-fadein {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes star-twinkle {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
    </style>
    <script>
      // Remueve el splash del DOM una vez completada la animación
      (function() {
        var splash = document.getElementById('waddle-splash');
        if (splash) {
          splash.addEventListener('animationend', function(e) {
            if (e.animationName === 'splash-fadeout') {
              splash.remove();
            }
          });
          // Safety: remover después de 4s por si algo falla
          setTimeout(function() {
            if (splash.parentNode) splash.remove();
          }, 4000);
        }
      })();
    </script>
  </body>
</html>
